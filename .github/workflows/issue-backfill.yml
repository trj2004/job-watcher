name: Backfill Job Watcher Issues

on:
  push:
    paths:
      - '.github/workflows/issue-backfill.yml'
      - 'scripts/update_issue.py'
      - 'jobwatcher/history.py'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.14'
      - name: Backfill daily issues from raw data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: uv run python scripts/update_issue.py
